{% extends "base.html" %}{% block title %}导入记录{% endblock %}{% block content %}<section class="page-head"><p class="eyebrow">系统管理</p><h1>导入记录</h1><p>查看历史导入文件和处理结果。</p></section><section class="panel"><table><thead><tr><th>文件</th><th>时间</th><th>结果</th></tr></thead><tbody>{% for item in items %}<tr><td>{{ item.filename }}</td><td>{{ item.imported_at }}</td><td class="clip-text">{{ item.result_json or '暂无' }}</td></tr>{% else %}<tr><td colspan="3" class="empty">暂无导入记录</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
