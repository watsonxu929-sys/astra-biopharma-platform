{% extends "base.html" %}{% block title %}情报列表{% endblock %}{% block content %}<section class="page-head action-head"><div><p class="eyebrow">情报中心</p><h1>情报列表</h1><p>查看人工录入和采集形成的原始情报。</p></div><a class="button primary" href="/intelligence/new">新增情报</a></section><form class="search-bar"><input name="q" value="{{ q }}" placeholder="搜索标题、正文或来源"><button class="button secondary" type="submit">筛选</button></form><section class="panel"><table><thead><tr><th>标题</th><th>来源</th><th>状态</th><th>时间</th><th>入口</th></tr></thead><tbody>{% for item in items %}<tr><td>{{ item.title }}</td><td>{{ item.source_type or '暂无' }}</td><td><span class="badge">{{ item.review_status or '待审核' }}</span></td><td>{{ item.created_at }}</td><td><a href="/intelligence/{{ item.id }}">详情</a></td></tr>{% else %}<tr><td colspan="5" class="empty">暂无情报</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
