{% extends "platform/base.html" %}
{% block platform_title %}页面未找到{% endblock %}
{% block platform_content %}
<div class="platform-content" style="max-width:600px;margin:80px auto;padding:24px 32px;text-align:center;">
  <div style="font-size:64px;color:var(--color-muted);margin-bottom:16px;">&#x1f50d;</div>
  <h1 style="font-size:28px;margin-bottom:12px;">未找到您访问的页面或内容</h1>
  <p style="color:var(--color-muted);font-size:15px;margin-bottom:32px;">请检查页面地址是否正确，或通过首页重新浏览。</p>
  <a href="{{ '/platform' if authenticated else '/account/login' }}" class="btn btn-primary">返回首页</a>
</div>
{% endblock %}
