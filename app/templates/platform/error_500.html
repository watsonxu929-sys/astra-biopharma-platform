{% extends "platform/base.html" %}
{% block platform_title %}服务暂时不可用{% endblock %}
{% block platform_content %}
<div class="platform-content" style="max-width:600px;margin:80px auto;padding:24px 32px;text-align:center;">
  <div style="font-size:64px;color:var(--color-danger, #d9534f);margin-bottom:16px;">&#x26a0;&#xfe0f;</div>
  <h1 style="font-size:28px;margin-bottom:12px;">系统暂时无法完成本次请求，请稍后重试</h1>
  <p style="color:var(--color-muted);font-size:15px;margin-bottom:32px;">如持续出现此问题，请联系系统管理员。</p>
  <a href="{{ '/platform' if authenticated else '/account/login' }}" class="btn btn-primary">返回首页</a>
</div>
{% endblock %}
